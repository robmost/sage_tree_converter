services:
  sage-converter:
    build: .
    working_dir: /app
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      COLORTERM: truecolor
      TERM: xterm-256color
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      SAGE_BINARY_PATH: "${SAGE_BINARY_PATH:-}"
      SAGE_MEMORY_MULTIPLIER: "${SAGE_MEMORY_MULTIPLIER:-3.0}"
    volumes:
      - .:/app
      - "${INPUT_DIR:-./input}:/app/input"
      - "${OUTPUT_DIR:-./output}:/app/output"
