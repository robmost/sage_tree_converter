name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with dev tooling
        run: pip install -e ".[dev]"

      - name: Point the Makefile at the CI interpreter
        run: echo "PYTHON_BIN=$(which python)" > .env

      - name: Lint, typecheck, and test
        run: make check
