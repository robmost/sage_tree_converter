services:
  sage-converter:
    build:
      context: ..
      dockerfile: container/Dockerfile
    working_dir: /app
    stdin_open: true
    tty: true
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ../.env
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      COLORTERM: truecolor
      TERM: xterm-256color
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      # agy (Antigravity CLI) uses OAuth, not an API key. SSH_TTY signals that no
      # browser is available, so agy falls back to the manual URL auth flow.
      SSH_TTY: /dev/pts/0
      SAGE_BINARY_PATH: "${SAGE_BINARY_PATH:-}"
      SAGE_MEMORY_MULTIPLIER: "${SAGE_MEMORY_MULTIPLIER:-3.0}"
      AUDITOR_CLI: "${AUDITOR_CLI:-}"
    volumes:
      - ..:/app
      - "${INPUT_DIR:-../input}:/app/input"
      - "${OUTPUT_DIR:-../output}:/app/output"
      # -- Optional: SAGE binary for Stage 2 functional validation --------------
      # Uncomment and set SAGE_BINARY_DIR in .env to the directory that contains
      # your compiled SAGE binary (same value as dirname of SAGE_BINARY_PATH).
      # The directory is mounted read-only at the same host path so that
      # SAGE_BINARY_PATH needs no changes.
      #   SAGE_BINARY_DIR=/path/to/sage/build
      # - "${SAGE_BINARY_DIR}:${SAGE_BINARY_DIR}:ro"
