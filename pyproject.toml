[project]
name = "sage-tree-converter"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "h5py",
    "pandas",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "basedpyright>=1.39",
    "pytest>=7.0",
]

[project.scripts]
sage-convert = "runner.batch_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["runner*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "audits",
    ".ai",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN401",  # use of Any type
]

[tool.ruff.lint.per-file-ignores]
# Tests need no type annotations and may import the engine packages freely.
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["errors", "utils", "drivers", "validation", "runner"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
extraPaths = ["conversion-engine"]
exclude = ["audits/**", ".ai/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the engine and runner packages importable without installing the project.
pythonpath = ["conversion-engine", "runner"]
