[project]
name = "sage-tree-converter"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "h5py",
    "pandas",
    "matplotlib",
    "tqdm",
]

[project.scripts]
sage-convert = "cli.batch_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "audits",
    ".ai",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN401",  # use of Any type
]

[tool.ruff.lint.isort]
known-first-party = ["utils", "drivers", "validation", "cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
extraPaths = ["conversion-engine"]
exclude = ["audits/**", ".ai/**"]
